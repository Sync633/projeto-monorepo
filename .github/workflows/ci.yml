name: Monorepo CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validar_monorepo:
    name: Validar Backend, Frontend e Docker 
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24 com Cache de Dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar Dependências do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Padronização de Código (ESlint)
        run: |
          cd backend
          pnpm run lint

      - name: 6. Validar Formatação de Arquivos (Prettier)
        run: |
          cd backend
          pnpm run format:check

      - name: 7. Checagem de Tipos no Backend (tsc --noEmit)
        run: |
          cd backend
          pnpm run type-check

      - name: 8. Validar Tipos e Compilar o Backend (Express)
        run: |
          cd backend
          pnpm run build

      - name: 9. Validar Construção da Imagem Docker da API
        run: |
          docker build -t api-service:test ./backend

      - name: 10.Validar Frontend (quando presente no monorepo)
        run: |
          if [ -d "app"]; then
            echo "Subprojeto frontend encontrado. Iniciando validação..."
            cd app
            pnpm install --frozen-lockfile
            pnpm run build
            docker build -t app-service:test ./app
          else
            echo "Subprojeto app ainda não adicionado ao monorepo."
          fi
      - name: 11. Resumo da execução
        run: |
          echo "Integração Continua concluida com sucesso!"
          echo "Autor da alteração: ${{ github.actor }}"
          echo "Commit validado: ${{ github.sha }}"
