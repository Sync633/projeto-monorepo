name: Monorepo CD Pipeline (Entrega de Produção)

on:
  # Dispara exclusivamente ao realizar merge ou push direto na branch principal
  push:
    branches:
      - main
  # Permite disparo manual controlado pelo painel web do GitHub Actions
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  publicar-imagem-docker:
    name: 1. Compilar e Publicar Imagem no Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar QEMU (Suporte a Múltiplas Arquiteturas)
        uses: docker/setup-qemu-action@v3

      - name: 3. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Extrair Metadados e Tags para o Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fatec-backend-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - name: 6. Compilar e Publicar Imagem (Build and Push com Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Resumo da Entrega no Step Summary
        run: |
          echo "### Entrega Contínua Concluída com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- **Registro**: Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem Publicada**: \`${{ secrets.DOCKERHUB_USERNAME }}/fatec-backend-api:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
  deploy-render:
    name: 2. Disparar Deploy no Render
    needs: [publicar-imagem-docker]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Disparar Webhook de Deploy no Render
        run: |
          echo "Disparando deploy na nuvem do Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Resposta do Render: $HTTP_BODY"
          echo "Codigo de Status HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Falha ao acionar o Deploy Hook no Render (Status $HTTP_STATUS)!"
            exit 1
          fi

      - name: 2. Publicar Resumo do Deploy no Painel do GitHub
        run: |
          echo "### Deploy Acionado com Sucesso no Render" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente**: Produção (Render Web Service)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gatilho**: Deploy Hook via GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Sincronização iniciada com a branch main" >> $GITHUB_STEP_SUMMARY
