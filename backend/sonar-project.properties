# Identificador único e organização no SonarCloud / SonarQube
sonar.projectKey=Sync633_projeto-monorepo
sonar.organization=sync633
sonar.projectName=Backend API monorepo

# URL do serviço (https://sonarcloud.io ou http://localhost:9000)
sonar.host.url=https://sonarcloud.io

# Diretório que contém o código-fonte da aplicação
sonar.sources=src

# Diretório e padrão de arquivos de teste
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts

# Caminho do relatório de cobertura no formato LCOV gerado pelo Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Arquivos que não devem ser analisados
sonar.exclusions=coverage/**,node_modules/**,dist/**

# Arquivos que não contam para o cálculo de cobertura (bootstrap sem lógica)
sonar.coverage.exclusions=src/server.ts